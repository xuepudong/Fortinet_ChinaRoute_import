services:
  fortigate-cn-updater:
    # 用 Docker Hub 上的多架构镜像（amd64 / arm64 自动匹配）
    image: ${IMAGE:xuepudong/fortigate-cn-ip-updater:only-all_cn}
    # 想本地自行构建就取消下面两行注释
    # build:
    #   context: .
    container_name: fortigate-allcn-updater
    restart: unless-stopped
    # iStoreOS / OpenWrt 等环境下，若容器连不通 FortiGate（连接超时），
    # 多半是防火墙不允许 docker zone 转发到 lan zone。取消下面这行注释，
    # 让容器直接使用宿主机网络即可绕开：
    # network_mode: host
    environment:
      # === 改这两行就能用 ===
      - FW_HOST=192.168.1.1
      - API_TOKEN=your_api_token_here
      # === 以下按需修改 ===
      - FW_PORT=443
      - VDOM=root
      - UPDATE_TIME=03:00
      - GROUP_NAME=Group_ALL-CN
      - MAX_WORKERS=20
      - WECHAT_WEBHOOK=
      - TZ=Asia/Shanghai
    volumes:
      - ./backups:/app/backups
      - ./logs:/app/logs
    # 启动即更新一次，之后每天 UPDATE_TIME 定时更新
    command: ["--now"]
